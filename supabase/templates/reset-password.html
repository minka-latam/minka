<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablece tu contraseña en Minka</title>
  </head>
  <body style="margin:0;background:#f5f7e9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7e9;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dfe7d8;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 20px;">
                <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-2S5vgSiFRwu8gClKBuwTXkOi5H46aN.svg" width="120" height="40" alt="Minka Comunidad" style="display:block;width:120px;height:auto;margin:0 0 24px;">
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25;color:#2c6e49;">Restablece tu contraseña</h1>
                <p style="margin:0 0 18px;font-size:16px;line-height:1.6;color:#374151;">
                  Recibimos una solicitud para cambiar la contraseña de tu cuenta en Minka. Usa el botón para crear una nueva contraseña.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#2c6e49;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;padding:13px 22px;border-radius:999px;">
                  Restablecer contraseña
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b7280;">
                  Si no solicitaste este cambio, puedes ignorar este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
